name: Desktop build (Windows + macOS x64/arm64 + optional universal)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Configure updater endpoint
        run: node scripts/set-updater-endpoint.cjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/app

      - name: Build (Tauri) Windows
        run: npm run tauri:build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v6
        with:
          name: mvptime-windows
          path: |
            src-tauri/app/target/**/release/bundle/**

  macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Configure updater endpoint
        run: node scripts/set-updater-endpoint.cjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/app

      - name: Build (Tauri) macOS x64 (Intel / Monterey+)
        run: npx tauri build --config src-tauri/app/tauri.conf.json --target x86_64-apple-darwin
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS x64 bundles
        uses: actions/upload-artifact@v6
        with:
          name: mvptime-macos-x64
          path: |
            src-tauri/app/target/x86_64-apple-darwin/release/bundle/**

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Configure updater endpoint
        run: node scripts/set-updater-endpoint.cjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/app

      - name: Build (Tauri) macOS arm64 (Apple Silicon)
        run: npx tauri build --config src-tauri/app/tauri.conf.json --target aarch64-apple-darwin
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS arm64 bundles
        uses: actions/upload-artifact@v6
        with:
          name: mvptime-macos-arm64
          path: |
            src-tauri/app/target/aarch64-apple-darwin/release/bundle/**

  macos-universal-optional:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Configure updater endpoint
        run: node scripts/set-updater-endpoint.cjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/app

      - name: Build (Tauri) macOS universal (best effort)
        run: npx tauri build --config src-tauri/app/tauri.conf.json --target universal-apple-darwin
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS universal bundles (if produced)
        uses: actions/upload-artifact@v6
        with:
          name: mvptime-macos-universal
          path: |
            src-tauri/app/target/universal-apple-darwin/release/bundle/**

  publish-release:
    needs: [windows-x64, macos-x64, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/download-artifact@v6
        with:
          name: mvptime-windows
          path: artifacts/windows

      - uses: actions/download-artifact@v6
        with:
          name: mvptime-macos-x64
          path: artifacts/macos-x64

      - uses: actions/download-artifact@v6
        with:
          name: mvptime-macos-arm64
          path: artifacts/macos-arm64

      - name: Merge updater latest.json
        run: node scripts/merge-tauri-latest-json.cjs artifacts/windows artifacts/macos-x64 artifacts/macos-arm64
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            latest.json
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.msi
            artifacts/windows/**/*.sig
            artifacts/macos-x64/**/*.dmg
            artifacts/macos-x64/**/*.tar.gz
            artifacts/macos-x64/**/*.sig
            artifacts/macos-arm64/**/*.dmg
            artifacts/macos-arm64/**/*.tar.gz
            artifacts/macos-arm64/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
